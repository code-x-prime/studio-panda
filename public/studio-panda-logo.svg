<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="100%" height="100%">
  <defs>
    <style>
      .bg-yellow { fill: #FFDD53; }
      .bg-black { fill: #080808; }
      .bg-panda-face { fill: #FFFEE8; }
      .bg-panda-shadow { fill: #EBE4C8; }
      .bg-panda-muzzle { fill: #FFFFFF; }
      .text-studio { font-family: 'Arial Black', 'Montserrat', 'Impact', sans-serif; font-weight: 900; font-size: 58px; fill: #080808; letter-spacing: 2px; }
      .text-panda { font-family: 'Arial Black', 'Montserrat', 'Impact', sans-serif; font-weight: 900; font-size: 58px; fill: #FFDD53; letter-spacing: 2px; }
    </style>
  </defs>

  <!-- Yellow Background Canvas (Optional framing) -->
  <rect width="700" height="320" class="bg-yellow" rx="16" />

  <!-- PANDA CHARACTER (Peeking over logo box) -->
  <g transform="translate(350, 112)">
    <!-- Ears -->
    <ellipse cx="-52" cy="-78" rx="30" ry="26" fill="#080808" transform="rotate(-15 -52 -78)" />
    <ellipse cx="52" cy="-78" rx="30" ry="26" fill="#080808" transform="rotate(15 52 -78)" />

    <!-- Head Outline / Shadow Base -->
    <ellipse cx="0" cy="-32" rx="72" ry="58" class="bg-panda-shadow" />
    
    <!-- Main Head Face -->
    <ellipse cx="0" cy="-35" rx="68" ry="54" class="bg-panda-face" />

    <!-- Eye Patches (Black Ovals Tilted) -->
    <ellipse cx="-26" cy="-35" rx="20" ry="24" fill="#080808" transform="rotate(18 -26 -35)" />
    <ellipse cx="26" cy="-35" rx="20" ry="24" fill="#080808" transform="rotate(-18 26 -35)" />

    <!-- Inner Eyes (White Highlights & Pupils) -->
    <circle cx="-23" cy="-37" r="7" fill="#FFFFFF" />
    <circle cx="-22" cy="-37" r="4" fill="#080808" />
    <circle cx="-20" cy="-39" r="1.5" fill="#FFFFFF" />

    <circle cx="23" cy="-37" r="7" fill="#FFFFFF" />
    <circle cx="22" cy="-37" r="4" fill="#080808" />
    <circle cx="20" cy="-39" r="1.5" fill="#FFFFFF" />

    <!-- Snout / Muzzle Area -->
    <ellipse cx="0" cy="-18" rx="20" ry="14" class="bg-panda-muzzle" />

    <!-- Nose -->
    <path d="M -9 -22 C -9 -22, 0 -17, 9 -22 C 11 -18, 0 -11, -9 -22 Z" fill="#080808" />

    <!-- Mouth Smile -->
    <path d="M -7 -14 Q 0 -9 7 -14" fill="none" stroke="#080808" stroke-width="2.5" stroke-linecap="round" />

    <!-- Rosy Cheeks -->
    <ellipse cx="-44" cy="-22" rx="9" ry="6" fill="#FFC436" opacity="0.4" />
    <ellipse cx="44" cy="-22" rx="9" ry="6" fill="#FFC436" opacity="0.4" />

    <!-- Left Paw Hugging Top Box Edge -->
    <g transform="translate(-86, 12)">
      <ellipse cx="0" cy="0" rx="32" ry="22" fill="#080808" transform="rotate(-10)" />
    </g>

    <!-- Right Paw Hugging Top Box Edge -->
    <g transform="translate(86, 12)">
      <ellipse cx="0" cy="0" rx="32" ry="22" fill="#080808" transform="rotate(10)" />
    </g>
  </g>

  <!-- LOGO BOX CONTAINER -->
  <g transform="translate(70, 135)">
    <!-- Outer Black Border Frame -->
    <rect x="0" y="0" width="560" height="150" fill="#080808" rx="4" />

    <!-- Inner Border Padding / Box Outline Cutout -->
    <rect x="14" y="14" width="532" height="122" fill="#080808" />

    <!-- Left Half Yellow Background -->
    <rect x="18" y="18" width="260" height="114" class="bg-yellow" />

    <!-- Left Text "STUDIO" -->
    <text x="32" y="96" class="text-studio">STUDIO</text>

    <!-- Right Text "PANDA" -->
    <text x="298" y="96" class="text-panda">PANDA</text>
  </g>
</svg>
